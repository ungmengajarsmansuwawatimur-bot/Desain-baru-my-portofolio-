<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%">
  <rect width="1280" height="800" fill="#F8FAFC"/>
  <!-- Sidebar -->
  <rect width="210" height="800" fill="#0F172A"/>
  <g transform="translate(14, 16)">
    <circle cx="16" cy="16" r="14" fill="#0066FF"/>
    <text x="16" y="21" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">S</text>
    <text x="38" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PADDS SMANSAT</text>
    <text x="38" y="27" fill="#64748B" font-family="-apple-system, sans-serif" font-size="8">Pusat Arsip &amp; Dokumen</text>
  </g>
  <!-- Topbar -->
  <rect x="210" y="0" width="1070" height="52" fill="#FFFFFF"/>
  <line x1="210" y1="52" x2="1280" y2="52" stroke="#E2E8F0" stroke-width="1"/>
  <text x="232" y="26" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Import Arsip</text>
  <text x="232" y="40" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Import dokumen secara massal</text>
  <!-- User badge -->
  <g transform="translate(1040, 10)">
    <circle cx="16" cy="16" r="14" fill="#0066FF"/>
    <text x="16" y="20" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">U</text>
    <text x="36" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">UngmengajarSMAN1...</text>
    <text x="36" y="25" fill="#64748B" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">VIEWER</text>
  </g>
  <!-- Content -->
  <g transform="translate(230, 68)">
    
<rect width="1020" height="70" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="24" y="30" fill="#1E40AF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Import Arsip</text>
<text x="24" y="50" fill="#1D4ED8" font-family="-apple-system, sans-serif" font-size="11">Migrasi puluhan hingga ribuan dokumen PDF dalam sekali jalan.</text>

<g transform="translate(0, 84)">
  <rect width="110" height="34" rx="6" fill="#0066FF"/>
  <text x="55" y="21" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Multi PDF</text>
  <rect x="120" y="0" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="170" y="21" text-anchor="middle" fill="#334155" font-family="-apple-system, sans-serif" font-size="11">File ZIP</text>
</g>

<g transform="translate(0, 130)">
  <rect width="1020" height="180" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6,6"/>
  <text x="510" y="80" text-anchor="middle" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Tarik &amp; lepas beberapa PDF di sini</text>
  <text x="510" y="104" text-anchor="middle" fill="#0066FF" font-family="-apple-system, sans-serif" font-size="11">atau klik untuk pilih file</text>
  <text x="510" y="126" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Multi-file • Format PDF</text>
</g>

<g transform="translate(0, 330)">
  <rect width="1020" height="120" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="24" y="32" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Preview Metadata</text>
  <text x="510" y="70" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Belum ada file — Unggah beberapa file PDF atau sebuah file ZIP untuk memulai migrasi arsip massal.</text>
</g>

  </g>
  <!-- Watermark -->
  <g transform="translate(1160, 770)">
    <rect width="105" height="22" rx="4" fill="#18181B"/>
    <text x="8" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8">Made with <tspan fill="#F43F5E" font-weight="bold">Lovable</tspan></text>
  </g>
</svg>