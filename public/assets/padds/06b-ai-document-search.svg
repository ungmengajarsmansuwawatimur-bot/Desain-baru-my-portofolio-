  <text x="232" y="26" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Cari Arsip</text>
  <text x="232" y="40" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Pencarian dokumen lanjutan</text>
  <!-- User badge -->
  <g transform="translate(1040, 10)">
    <circle cx="16" cy="16" r="14" fill="#0066FF"/>
    <text x="16" y="20" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">U</text>
    <text x="36" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">UngmengajarSMAN1...</text>
    <text x="36" y="25" fill="#64748B" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">VIEWER</text>
  </g>
  <!-- Content -->
  <g transform="translate(230, 68)">
    
<g transform="translate(0, 0)">
  <rect width="140" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="70" y="21" text-anchor="middle" fill="#334155" font-family="-apple-system, sans-serif" font-size="11">Pencarian Standar</text>
  <rect x="150" y="0" width="160" height="34" rx="6" fill="#0066FF"/>
  <text x="230" y="21" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">✨ AI Document Search</text>
  <rect x="320" y="0" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="380" y="21" text-anchor="middle" fill="#334155" font-family="-apple-system, sans-serif" font-size="11">🛡 Tindak Lanjut</text>
</g>
<g transform="translate(0, 50)">
  <rect width="1020" height="120" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="24" y="32" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">AI Document Search</text>
  <text x="24" y="50" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Cari arsip menggunakan bahasa alami — sebutkan isi pembahasan, nama instansi, kegiatan, atau topik dokumen.</text>
  <rect x="24" y="66" width="830" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="40" y="88" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Contoh: surat undangan rapat dari Dinas Pendidikan tentang kurikulum</text>
  <rect x="870" y="66" width="126" height="36" rx="6" fill="#0066FF"/>
  <text x="933" y="88" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">✨ Cari dengan AI</text>
</g>

  </g>
  <!-- Watermark -->
  <g transform="translate(1160, 770)">
    <rect width="105" height="22" rx="4" fill="#18181B"/>
    <text x="8" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8">Made with <tspan fill="#F43F5E" font-weight="bold">Lovable</tspan></text>
  </g>
