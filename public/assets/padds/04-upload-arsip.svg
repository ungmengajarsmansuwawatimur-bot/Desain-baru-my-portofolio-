<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%">
  <rect width="1280" height="800" fill="#F8FAFC"/>
  <!-- Sidebar -->
  <rect width="210" height="800" fill="#0F172A"/>
  <g transform="translate(14, 16)">
    <circle cx="16" cy="16" r="14" fill="#0066FF"/>
    <text x="16" y="21" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">S</text>
    <text x="38" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PADDS SMANSAT</text>
    <text x="38" y="27" fill="#64748B" font-family="-apple-system, sans-serif" font-size="8">Pusat Arsip &amp; Dokumen</text>
  </g>
  <!-- Topbar -->
  <rect x="210" y="0" width="1070" height="52" fill="#FFFFFF"/>
  <line x1="210" y1="52" x2="1280" y2="52" stroke="#E2E8F0" stroke-width="1"/>
  <text x="232" y="26" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Upload Arsip</text>
  <text x="232" y="40" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Tambah dokumen baru ke sistem</text>
  <!-- User badge -->
  <g transform="translate(1040, 10)">
    <circle cx="16" cy="16" r="14" fill="#0066FF"/>
    <text x="16" y="20" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">U</text>
    <text x="36" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">UngmengajarSMAN1...</text>
    <text x="36" y="25" fill="#64748B" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">VIEWER</text>
  </g>
  <!-- Content -->
  <g transform="translate(230, 68)">
    
<rect width="1020" height="74" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
<text x="24" y="30" fill="#166534" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Upload Arsip — Alur Intake Berbantuan AI</text>
<text x="24" y="50" fill="#15803D" font-family="-apple-system, sans-serif" font-size="10">Dua tahap AI membantu proses upload: AI Analisis Metadata &amp; AI Pengecekan Nomor Surat. Maksimal 50 file.</text>

<!-- 4 Stepper -->
<g transform="translate(0, 90)">
  <rect width="1020" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="40" cy="30" r="14" fill="#0066FF"/>
  <text x="40" y="34" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10">1</text>
  <text x="64" y="26" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Intake</text>
  <text x="64" y="40" fill="#64748B" font-family="-apple-system, sans-serif" font-size="9">0/50 file</text>

  <circle cx="280" cy="30" r="14" fill="#F1F5F9"/>
  <text x="280" y="34" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">2</text>
  <text x="304" y="26" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">AI Analisis Metadata</text>

  <circle cx="560" cy="30" r="14" fill="#F1F5F9"/>
  <text x="560" y="34" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">3</text>
  <text x="584" y="26" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">AI Pengecekan Nomor Surat</text>

  <circle cx="840" cy="30" r="14" fill="#F1F5F9"/>
  <text x="840" y="34" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">4</text>
  <text x="864" y="26" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Upload</text>
</g>

<!-- Dropzone -->
<g transform="translate(0, 166)">
  <rect width="680" height="180" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6,6"/>
  <text x="340" y="80" text-anchor="middle" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Tarik &amp; lepas dokumen di sini</text>
  <text x="340" y="104" text-anchor="middle" fill="#0066FF" font-family="-apple-system, sans-serif" font-size="11">klik untuk memilih file dari perangkat</text>
  <text x="340" y="126" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">PDF, DOC, DOCX, XLS, CSV, TXT, PNG, JPG • Maks 5 MB / file</text>
  <rect x="270" y="140" width="140" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="340" y="158" text-anchor="middle" fill="#334155" font-family="-apple-system, sans-serif" font-size="10">📷 Ambil dari kamera</text>

  <!-- Right sidebar summary -->
  <g transform="translate(710, 0)">
    <rect width="310" height="180" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="30" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Ringkasan Upload</text>
    <text x="20" y="60" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Total File: 0 / 50</text>
    <text x="20" y="85" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Sudah Dianalisis: 0</text>
    <text x="20" y="110" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Siap Diperiksa: 0</text>
    <text x="20" y="135" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Siap Diupload: 0</text>
  </g>
</g>

  </g>
  <!-- Watermark -->
  <g transform="translate(1160, 770)">
    <rect width="105" height="22" rx="4" fill="#18181B"/>
    <text x="8" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8">Made with <tspan fill="#F43F5E" font-weight="bold">Lovable</tspan></text>
  </g>
</svg>