    <text x="10" y="38" fill="#050505" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Penguatan Pemahaman Layanan BK oleh</text>
    <text x="10" y="52" fill="#050505" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Mahasiswa UNG di SMA Negeri 1 Gorontalo</text>

