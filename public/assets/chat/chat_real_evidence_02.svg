    <text x="240" y="42" fill="#8696A0" font-family="-apple-system, sans-serif" font-size="10">13.08</text>
  </g>

  <!-- Customer: kak -->
  <g transform="translate(14, 282)" filter="url(#shadowDark2)">
    <rect width="84" height="32" rx="8" fill="#202C33" />
    <path d="M0 8 L-6 0 L6 0 Z" fill="#202C33" />
    <text x="12" y="21" fill="#E9EDEF" font-family="-apple-system, sans-serif" font-size="12.5">kak</text>
