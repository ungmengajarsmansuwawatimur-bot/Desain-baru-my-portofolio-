<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <filter id="shadowDark2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <pattern id="waDarkDoodle2" x="0" y="0" width="140" height="140" patternUnits="userSpaceOnUse">
      <path d="M20 30 Q30 10 40 30 T60 30" fill="none" stroke="#18252D" stroke-width="1.2" opacity="0.6"/>
      <circle cx="85" cy="40" r="8" fill="none" stroke="#18252D" stroke-width="1.2" opacity="0.6"/>
      <rect x="25" y="75" width="16" height="12" rx="3" fill="none" stroke="#18252D" stroke-width="1.2" opacity="0.6"/>
      <path d="M80 85 L95 100 M95 85 L80 100" stroke="#18252D" stroke-width="1.2" opacity="0.6"/>
      <circle cx="120" cy="115" r="5" fill="none" stroke="#18252D" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Wallpaper -->
  <rect width="400" height="840" fill="#0B141A" />
  <rect width="400" height="840" fill="url(#waDarkDoodle2)" />

  <!-- WhatsApp Top App Bar -->
  <rect width="400" height="74" fill="#121B22" />
  <!-- Back Arrow -->
  <path d="M24 48 L12 48 M18 42 L11 48 L18 54" stroke="#E9EDEF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Avatar 'C' on dark plum -->
  <circle cx="58" cy="48" r="18" fill="#4B2338" />
  <text x="58" y="54" text-anchor="middle" fill="#E87FA1" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">C</text>
  <!-- Contact Name -->
  <text x="88" y="44" fill="#E9EDEF" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Customer Mahasi...</text>
  <text x="88" y="59" fill="#8696A0" font-family="-apple-system, sans-serif" font-size="11">ketuk untuk info kontak</text>

  <!-- Icons: Video, Call, 3 Dots -->
  <g fill="#E9EDEF" transform="translate(270, 38)">
    <path d="M4 4 L14 4 C15.1 4 16 4.9 16 6 L16 14 C16 15.1 15.1 16 14 16 L4 16 C2.9 16 2 15.1 2 14 L2 6 C2 4.9 2.9 4 4 4 Z M16 8 L22 4 L22 16 L16 12 Z" />
    <path d="M48 4 C47 3 45 3 44 4 L42 6 C41 7 41 8 42 10 C44 13 47 16 50 18 C52 19 53 19 54 18 L56 16 C57 15 57 13 56 12 L53 10 C52 9 51 9 50 10 L49 11 C47 10 46 9 45 7 L46 6 C47 5 47 4 46 3 Z" />
    <circle cx="85" cy="4" r="2" />
    <circle cx="85" cy="10" r="2" />
    <circle cx="85" cy="16" r="2" />
  </g>

  <!-- Date Pill -->
  <g transform="translate(138, 86)">
    <rect width="124" height="24" rx="12" fill="#182229" />
    <text x="62" y="16" text-anchor="middle" fill="#8696A0" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">8 Desember 2025</text>
  </g>

  <!-- End-to-end Encryption Banner -->
  <g transform="translate(30, 118)">
    <rect width="340" height="64" rx="8" fill="#182229" stroke="#222E35" stroke-width="0.8" />
    <!-- Lock Icon -->
    <path d="M60 14 C60 11 63 9 66 9 C69 9 72 11 72 14 L72 17 L60 17 Z" fill="none" stroke="#FFD279" stroke-width="1.5" />
    <rect x="58" y="17" width="16" height="11" rx="2" fill="#FFD279" />
    <text x="170" y="24" text-anchor="middle" fill="#FFD279" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500">Pesan dan telepon terenkripsi secara</text>
    <text x="170" y="38" text-anchor="middle" fill="#FFD279" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500">end-to-end. Hanya orang di obrolan ini</text>
    <text x="170" y="52" text-anchor="middle" fill="#FFD279" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500">yang bisa membaca. Pelajari selengkapnya.</text>
  </g>

  <!-- Info: Customer Mahasiswa kini menjadi kontak -->
  <g transform="translate(60, 190)">
    <rect width="280" height="24" rx="12" fill="#182229" />
    <text x="140" y="16" text-anchor="middle" fill="#8696A0" font-family="-apple-system, sans-serif" font-size="10.5">Customer Mahasiswa kini menjadi kontak</text>
  </g>

