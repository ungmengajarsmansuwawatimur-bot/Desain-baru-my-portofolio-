    <rect x="10" y="93" width="262" height="28" rx="4" fill="#FEFCE8" stroke="#FEF08A" stroke-width="0.8" />
    <text x="15" y="104" fill="#713F12" font-family="-apple-system, sans-serif" font-size="7">Kompasiana adalah platform blog. Konten ini menjadi tanggung jawab bloger dan</text>
    <text x="15" y="114" fill="#713F12" font-family="-apple-system, sans-serif" font-size="7">tidak mewakili pandangan redaksi Kompas.</text>

    <!-- Main Photo (Sesi icebreaking siswa di kelas) -->
    <g transform="translate(10, 126)">
      <rect width="262" height="88" rx="4" fill="#E2E8F0" />
      <!-- Graphic representation of classroom scene -->
      <rect x="0" y="0" width="262" height="88" fill="#CBD5E1" />
      <rect x="0" y="44" width="262" height="44" fill="#94A3B8" />
      <!-- Windows / Classroom elements -->
      <rect x="12" y="8" width="55" height="30" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
      <rect x="195" y="8" width="55" height="30" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
      <!-- Presenter in maroon jacket & students in white uniforms -->
      <circle cx="100" cy="40" r="14" fill="#881337" />
      <path d="M80 84 C80 62 88 54 100 54 C112 54 120 62 120 84 Z" fill="#881337" />
      <circle cx="155" cy="46" r="11" fill="#475569" />
      <path d="M140 84 C140 68 146 60 155 60 C164 60 170 68 170 84 Z" fill="#F8FAFC" />
      <circle cx="185" cy="48" r="11" fill="#475569" />
      <path d="M172 84 C172 70 177 62 185 62 C193 62 198 70 198 84 Z" fill="#F8FAFC" />
      <!-- Classroom Desks -->
      <rect x="135" y="68" width="70" height="16" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8" />
    </g>

    <!-- Photo Caption -->
    <text x="10" y="223" fill="#65676B" font-family="-apple-system, sans-serif" font-size="7">Sesi icebreaking siswa bk ung bersama siswa SMAN 1 GORONTALO, Sumber</text>
    <text x="10" y="232" fill="#65676B" font-family="-apple-system, sans-serif" font-size="7">gambar dokumen pribadi</text>

