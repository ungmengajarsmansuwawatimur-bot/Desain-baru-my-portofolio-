      <text x="8" y="11.5" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">𝕏</text>
      <circle cx="28" cy="8" r="8" fill="#1877F2" />
      <text x="28" y="12" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">f</text>
      <circle cx="48" cy="8" r="8" fill="#0A66C2" />
      <text x="48" y="12" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">in</text>
