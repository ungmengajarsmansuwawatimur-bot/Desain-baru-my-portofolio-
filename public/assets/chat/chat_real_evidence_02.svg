    <g transform="translate(10, 236)">
      <rect x="0" y="0" width="80" height="26" rx="2" fill="#94A3B8" />
      <rect x="86" y="0" width="80" height="26" rx="2" fill="#64748B" />
      <rect x="172" y="0" width="80" height="26" rx="2" fill="#475569" />
    </g>
