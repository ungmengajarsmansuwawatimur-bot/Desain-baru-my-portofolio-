    <text x="14" y="40" fill="#E9EDEF" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">50-100k ka 🙏</text>
    <text x="150" y="42" fill="#8696A0" font-family="-apple-system, sans-serif" font-size="10">13.17</text>
    <path d="M182 38 L186 42 L194 33 M187 38 L191 42 L199 33" stroke="#53BDEB" stroke-width="1.6" fill="none" stroke-linecap="round" />
  </g>

  <!-- Floating Scroll Down Circle Button -->
