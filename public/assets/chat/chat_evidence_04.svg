    <text x="14" y="44" fill="#111B21" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="400">lain bisa hubungi saya lagi ya.</text>
    <text x="248" y="65" fill="#667781" font-family="-apple-system, sans-serif" font-size="11">16.25</text>
