    <rect width="300" height="54" rx="8" fill="#FFFFFF" />
    <text x="14" y="25" fill="#111B21" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="400">Oke, nanti kalau ada tambahan saya kabarin 🙏</text>
    <text x="264" y="45" fill="#667781" font-family="-apple-system, sans-serif" font-size="11">16.30</text>
