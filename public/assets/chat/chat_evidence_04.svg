    <path d="M48 6 C47 5 45 5 44 6 L42 8 C41 9 41 10 42 12 C44 15 47 18 50 20 C52 21 53 21 54 20 L56 18 C57 17 57 15 56 14 L53 12 C52 11 51 11 50 12 L49 13 C47 12 46 11 45 9 L46 8 C47 7 47 6 46 5 Z" />
