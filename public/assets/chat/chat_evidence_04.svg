    <path d="M356 22 C356 25.3 358.7 28 362 28 C365.3 28 368 25.3 368 22 M362 28 L362 33 M358 33 L366 33" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />
